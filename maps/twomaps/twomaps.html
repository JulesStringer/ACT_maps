    <style>
        .atts table {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 0;
            margin: 0;
        }

        .atts th {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 0;
            margin: 0;
        }

        .atts td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 0;
            margin: 0;
        }

        .noborder {
            border: none;
            padding: 0;
            margin: 0;
        }

        .ol-popup {
            position: absolute;
            background-color: rgba(255,255,255,0.4);
            -webkit-filter: drop-shadow(0 1px 4px rgba(0,0,0,0.2));
            filter: drop-shadow(0 1px 4px rgba(0,0,0,0.2));
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -140px;
            min-width: 280px;
        }

            .ol-popup:after, .ol-popup:before {
                top: 100%;
                border: solid transparent;
                content: " ";
                height: 0;
                width: 0;
                position: absolute;
                pointer-events: none;
            }

            .ol-popup:after {
                border-top-color: white;
                border-width: 10px;
                left: 48px;
                margin-left: -10px;
            }

            .ol-popup:before {
                border-top-color: #cccccc;
                border-width: 11px;
                left: 48px;
                margin-left: -11px;
            }

        .ol-popup-closer {
            text-decoration: none;
            position: absolute;
            bottom: 2px;
            left: 50%;
        }

            .ol-popup-closer:after {
                content: "✖";
            }
/*

    <style>
/* General Layout & Iframe Sizing */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* Main vertical container for the whole page */
.main-container {
    width: 100%;
    height: 100%;
}
/* Default styles for desktop/landscape */
.grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr 250px; /* Two equal columns for maps, one fixed for control */
    grid-template-rows: 100%;
    width: 100%;
    height: 100%;
}
/* Individual Panels (within top-section) */
.map-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    border: solid 1px lightgray;
    box-sizing: border-box;
}
.map-title {
    position: absolute;
    top: 10px; /* Adjust as needed */
    right: 10px; /* Adjust as needed */
  /*  z-index: 100;*/ /* Ensures it appears on top of the map */
    color: black;
    background-color: rgba(255, 255, 255, 0.3);
    padding: 5px;
    border-radius: 5px;
    font-weight: bold;
}

.map-coords {
    position: absolute;
    bottom: 10px; /* Adjust as needed */
    left: 10px; /* Adjust as needed */
    /*z-index: 100;*/ /* Ensures it appears on top of the map */
    color: black;
    background-color: rgba(255, 255, 255, 0.3);
    padding: 5px;
    border-radius: 5px;
}
@media (max-width: 600px){
    .map-coords{
        max-width: 8ch;
    }
    .map-title{
        max-width: 10ch;
    }
}
/* Maps fill their panels */
.map {
    width: 100%;
    height: 100%;
}

/* Control Panel Specifics */
/* Control Panel Specifics - Default for Landscape */
.control-panel {
    display: flex;
    flex-direction: column;
}

.top-control {
    flex: 1; /* Allows it to grow and take space */
    display: flex;
    flex-direction: column; /* Stack control-scroll and hover-panel vertically */
}

.bottom-control {
    flex: 1; /* Allows it to grow and take space */
    display: flex;
    flex-direction: column; /* Stacks its children vertically */
}
#control-button {
    display: none;
}

.control-scroll {
    width: 100%;
    height: 100%;
    max-height: 350px;
    overflow-y: auto;
}

.control-table {
    width: 100%;
    table-layout: fixed;
}

/* Bottom Panel Styling */
.atts-panel {
    height: 100%;
    border: solid 1px lightgray;
    box-sizing: border-box;
    overflow: auto;
}
#logo{
    display:block;
    width:50px;
    height:50px;
}
.atts {
    width: 100%;
    height: 100%;
    overflow: auto;
}
.hover-panel {
    margin-left: 15px;
    white-space: nowrap;
}
.layout-landscape{
    display:none;
}
.layout-portrait{
    display:none;
}
@media (orientation: portrait), (max-width:600px) {
    /* Main container stacks everything vertically and fills the viewport */
    .main-container {
        display: flex; /* Make it a flex container */
        flex-direction: column; /* Stack top and bottom sections vertically */
        width: 100%;
        height: 100%;
    }

    /* Grid container is now a Flexbox container for vertical stacking */
    .grid-container {
        display: flex; /* Use Flexbox for vertical stacking */
        flex-direction: column;
        flex: 1; /* This is the key. It makes the container fill all available vertical space */
        width: 100%;
        height: auto; /* Let the height be determined by its content */
        overflow-y: auto; /* Allow scrolling if content overflows */
    }

    /* The top-level panels will now share the available vertical space */
    .map-panel {
        flex: 1; /* Each map panel takes an equal share of the vertical space */
        height: auto;
        min-height: 250px; /* Ensures a minimum height */
    }
    .control-panel {
        flex: 0.5; /* The control panel will take half the space of a map panel */
        display: flex;
        flex-direction: row; /* For side-by-side internal layout */
        height: auto;
        min-height: 200px; /* A minimum height to ensure usability */
        padding: 5px;
    }

/* Make the top-control and bottom-control sections flexible */
    .top-control {
        flex: 0; /* Prevents it from growing */
        flex-basis: 250px; /* A base width for the column */
        max-width: 250px; /* Sets the maximum width */
        min-width: 200px;
        display: flex;
        flex-direction: column;
        padding: 5px;
    }
    .bottom-control {
        flex: 1; /* This will make the bottom control grow to fill the remaining space */
        display: flex;
        flex-direction: column;
        padding: 5px;
    }
    /* Adjust internal element heights */
/*
    #control-button {
        display: block;
        max-width: 100px;
    }
*/
    .control-scroll {
        flex: 1; /* Takes up available vertical space within top-control */
        max-height: 350px;
        min-height: unset;
        width: 100%;
        height: auto;
/*        display:none; */
    }

    .atts-panel {
        flex: 1; /* Takes up available vertical space within bottom-control */
        height: auto;
        padding: 10px;
    }

    .hover-panel {
        margin-left: 0;
        margin-top: 10px;
        white-space: nowrap;
    }
    .layout-landscape{
        display:none;
    }
    .layout-portrait{
        display:none;
    }
}    </style>
