<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../ol/v6.5.0-dist/ol.css" type="text/css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="../../ol/v6.5.0-dist/ol.js"></script>
    <script src="../../proj4/dist/proj4.js"></script>
    <script src="../../mapping/tables.js"></script>
    <script src="../../mapping/geometry.js"></script>
    <script src="../../mapping/condition.js"></script>
    <script src="../../mapping/tooltips.js"></script>
    <script src="../../mapping/mapdisplay.js"></script>
    <script src="./twomaps.js"></script>
    <style>
        .atts table {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 0;
            margin: 0;
        }

        .atts th {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 0;
            margin: 0;
        }

        .atts td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 0;
            margin: 0;
        }

        .noborder {
            border: none;
            padding: 0;
            margin: 0;
        }

        .ol-popup {
            position: absolute;
            background-color: white;
            -webkit-filter: drop-shadow(0 1px 4px rgba(0,0,0,0.2));
            filter: drop-shadow(0 1px 4px rgba(0,0,0,0.2));
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 280px;
        }

            .ol-popup:after, .ol-popup:before {
                top: 100%;
                border: solid transparent;
                content: " ";
                height: 0;
                width: 0;
                position: absolute;
                pointer-events: none;
            }

            .ol-popup:after {
                border-top-color: white;
                border-width: 10px;
                left: 48px;
                margin-left: -10px;
            }

            .ol-popup:before {
                border-top-color: #cccccc;
                border-width: 11px;
                left: 48px;
                margin-left: -11px;
            }

        .ol-popup-closer {
            text-decoration: none;
            position: absolute;
            top: 2px;
            right: 8px;
        }

            .ol-popup-closer:after {
                content: "✖";
            }
        /* General Layout & Iframe Sizing */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* Main vertical container for the whole page */
.main-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
}

/* Horizontal container for the map panels */
.top-section {
    display: flex;
    flex: 1; /* This makes the top section grow to fill all remaining vertical space */
    width: 100%;
    overflow: hidden; /* Prevents overflow */
}

/* Bottom section with a fixed height */
.bottom-section {
    display: flex;
    height: 110px; /* The fixed height for the bottom panel */
    width: 100%;
    align-items: center; /* Vertically centers content */
    padding: 0 10px;
    box-sizing: border-box; /* Includes padding in the total height */
}

/* Individual Panels (within top-section) */
.map-panel {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: solid 1px lightgray;
    box-sizing: border-box;
}

/* Maps fill their panels */
.map {
    width: 100%;
    height: 100%;
}

/* Control Panel Specifics */
.control-panel {
    min-width: 350px;
}

.control-scroll {
    width: 100%;
    height: 100%;
    overflow-y: auto;
}

.control-table {
    width: 100%;
    table-layout: fixed;
}

/* Bottom Panel Styling */
.atts-panel {
    flex: 1; /* This will make the atts panel take up all available horizontal space */
    height: 100%;
    border: solid 1px lightgray;
    box-sizing: border-box;
    overflow: auto; /* Enables scrolling for the attributes */
}

.atts {
    width: 100%;
    height: 100%;
    overflow: auto;
}

.hover-panel {
    margin-left: 15px; /* Adds space between the atts panel and the checkbox */
    white-space: nowrap;
}
    </style>
    <title id="title">Title needs filling from config.title</title>
</head>
<body onload="onload(true);">
    <div class="main-container">

        <div class="top-section">
            <div class="map-panel">
                <div id="mapCurrent" class="map"></div>
                <span id="title1" class="map-title">Current CO₂ Emissions</span>
                <span id="coordsCurrent" class="map-coords"></span>
            </div>

            <div class="map-panel">
                <div id="mapPotential" class="map"></div>
                <span id="title2" class="map-title">Potential CO₂ Emissions</span>
                <span id="coordsPotential" class="map-coords"></span>
            </div>

            <div class="map-panel control-panel">
                <div class="control-scroll">
                    <table id="control" class="control-table"></table>
                </div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="atts-panel">
                <div class="atts" id="selected"></div>
            </div>
            <div class="hover-panel">
                <input type="checkbox" id="hover" onclick="onhover();" />Hover to show summary
            </div>
        </div>

    </div>
    <div id="popupCurrent" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer" onclick="popupcloser('mapCurrent');"></a>
        <div id="popup-content"></div>
    </div>
    <div id="popupPotential" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer" onclick="popupcloser('mapPotential');"></a>
        <div id="popup-content"></div>
    </div>
    <div class="atts" id="detail"
         style="position:fixed; top:0px;right:0px;width:600px;height:600px;background-color: white;">
        <!--<a href="#" id="detail-closer" class="ol-popup-closer" onclick="closedetail();"></a>-->
        <h1 id="detail-title"></h1>
        <div style="height:30px;">
            <button type="button" onclick="on_top('detail-content');" style="float:left;">Top</button>
            <!--
    <button type="button" onclick="on_print();" style="float:left;">Print</button>
        -->
            <button type="button" id="detail-closer" style="float:right;" onclick="closedetail();">Close</button>
        </div>
        <div id="detail-content" style="overflow:auto;height:500px;"></div>
    </div>
</body>
</html>
